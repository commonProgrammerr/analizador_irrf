[project]
name = "analizador-irrf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "André Escorel", email = "gustavo.escorel@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "numpy>=2.0",
    "pandas>=3.0",
    "rich>=13.0",
    "rich-click>=1.7",
]

[project.scripts]
analizador-irrf = "analizador_irrf:main"
irrf = "analizador_irrf:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
